server:
  port: 8080

spring:
  application:
    name: mini-mall
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库账号密码通过环境变量注入，仓库不提交真实口令（本地默认 root / 空密码）
    url: jdbc:mysql://localhost:3306/mini_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线可删除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  # HS256 密钥（至少 32 字节），必须通过环境变量 JWT_SECRET 注入，仓库不提交真实密钥
  secret: ${JWT_SECRET:}
  expire-hours: 72

# 应用配置
app:
  cors:
    # 允许跨域的前端来源，逗号分隔；生产改为实际域名
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # 首次启动自动创建默认管理员的初始密码；留空则生成随机密码并打印到日志
    init-password: ${ADMIN_INIT_PASSWORD:}

# 文件上传
file:
  # 相对运行目录（mvn spring-boot:run 时为 backend/），最终为 backend/uploads/
  upload-dir: ./uploads
server:
  port: 8080

spring:
  application:
    name: mini-mall
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TODO: 请把数据库用户名/密码改成你本机 MySQL 的实际账号密码
    url: jdbc:mysql://localhost:3306/mini_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线可删除
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  # HS256 需要至少 32 字节的密钥，请按需替换
  secret: mini-mall-jwt-secret-please-change-me-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
  expire-hours: 72

# 文件上传
file:
  # 相对运行目录（mvn spring-boot:run 时为 backend/），最终为 backend/uploads/
  upload-dir: ./uploads